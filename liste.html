<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Wunschliste</title>
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#fff8f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1517" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="Wunschliste">
  <link rel="preload" href="assets/fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main id="app"><p class="loading">Wunschliste wird geladen …</p></main>

  <dialog id="claim-dialog">
    <form method="dialog" id="claim-form" class="stack">
      <h2><span class="emo">🎁</span>Besorge ich</h2>
      <p id="claim-item-title" style="margin:0;font-weight:600"></p>
      <p class="muted small" style="margin:0">Der Wunsch wird danach für alle anderen als gekauft angezeigt,
        damit nichts doppelt geschenkt wird.</p>
      <label class="field">Dein Name <span class="hint">(sehen die anderen Schenkenden)</span>
        <input type="text" name="claimer" required maxlength="60" placeholder="z. B. Oma Inge" autocomplete="name">
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>Abbrechen</button>
        <button type="submit" class="btn primary" id="claim-submit"><span class="emo">🎉</span> Ja, besorge ich</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/supabase.js"></script>
  <script src="assets/config.js"></script>
  <script type="module" src="assets/liste.js"></script>
</body>
</html>
