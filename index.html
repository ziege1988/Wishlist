<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Wunschlisten</title>
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#fbf8f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161311" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wunschlisten">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><img src="assets/icons/icon-192.png" alt=""> Wunschlisten</a>
    <div class="userbox" id="userbox"></div>
  </header>

  <main id="app"><p class="loading">Lädt …</p></main>

  <!-- Person anlegen / bearbeiten -->
  <dialog id="person-dialog">
    <form method="dialog" id="person-form" class="stack">
      <h2 id="person-dialog-title">Neue Wunschliste</h2>
      <label class="field">Für wen ist die Liste?
        <input type="text" name="name" required maxlength="80" placeholder="z. B. Lena" autocomplete="off">
      </label>
      <div class="field">Anlass
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="theme" value="birthday" checked><span class="emo">🎂</span>Geburtstag</label>
          <label><input type="radio" name="theme" value="christmas"><span class="emo">🎄</span>Weihnachten</label>
          <label><input type="radio" name="theme" value="other"><span class="emo">🎁</span>Sonstiges</label>
        </div>
      </div>
      <label class="field" id="event-date-field"><span id="event-date-label">Geburtstag</span>
        <span class="hint" id="event-date-hint">(optional – mit Geburtsjahr zeigen wir auch das Alter)</span>
        <input type="date" name="event_date">
      </label>
      <label class="field">Titel <span class="hint">(optional, z. B. „7. Geburtstag“ oder „Weihnachten 2026“)</span>
        <input type="text" name="occasion" maxlength="120" autocomplete="off">
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>Abbrechen</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <!-- Wunsch anlegen / bearbeiten -->
  <dialog id="item-dialog">
    <form method="dialog" id="item-form" class="stack">
      <h2 id="item-dialog-title">Neuer Wunsch</h2>
      <div class="field">Link zum Produkt <span class="hint">(optional – Titel, Preis und Bild werden dann automatisch geladen)</span>
        <div class="input-row">
          <input type="text" inputmode="url" name="url" maxlength="2000" placeholder="https://…" autocomplete="off">
          <button type="button" class="btn sm" id="fetch-info">✨ Laden</button>
        </div>
        <div class="fetch-status" id="fetch-status"></div>
      </div>
      <label class="field">Produkt
        <input type="text" name="title" required maxlength="200" placeholder="z. B. LEGO Baumhaus" autocomplete="off">
      </label>
      <div class="two-col">
        <label class="field">Preis in € <span class="hint">(optional)</span>
          <input type="text" name="price" inputmode="decimal" placeholder="49,99" autocomplete="off">
        </label>
        <label class="check" style="padding-bottom:12px"><input type="checkbox" name="favorite"> ❤️ Herzenswunsch</label>
      </div>
      <label class="check" id="auto-price-row"><input type="checkbox" name="auto_price" checked> 🔄 Preis automatisch aus dem Link aktuell halten</label>
      <div class="field">Produktbild <span class="hint">(optional – auch per Einfügen aus der Zwischenablage)</span>
        <div class="img-picker">
          <div class="img-preview" id="img-preview">Kein Bild</div>
          <div class="stack" style="flex:1">
            <input type="file" name="image" id="image-input" accept="image/*">
            <button type="button" class="btn sm danger" id="image-remove" hidden>Bild entfernen</button>
          </div>
        </div>
      </div>
      <label class="field">Notiz <span class="hint">(optional, z. B. Größe, Farbe)</span>
        <textarea name="note" maxlength="500" rows="2"></textarea>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>Abbrechen</button>
        <button type="submit" class="btn primary" id="item-save">Speichern</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/supabase.js"></script>
  <script src="assets/config.js"></script>
  <script type="module" src="assets/admin.js"></script>
</body>
</html>
